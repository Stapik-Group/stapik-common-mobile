# Copy to .github/workflows/pull-request.yml of an app.
# Pull requests from develop to master/main are built and tested; a push alone does nothing.
name: Pull request

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'develop'
    # Pin @v... to the release of stapik-common-mobile that the submodule is on.
    uses: Stapik-Group/stapik-common-mobile/.github/workflows/build.yml@v0.3.1
    secrets: inherit
